# DiscordLinked configuration. Restart the proxy after changing this file.

# Bot token from https://discord.com/developers/applications -> your app -> Bot -> Reset Token.
# Keep this secret.
bot-token=

# Right-click your server in Discord -> Copy Server ID (needs Developer Mode, in Settings -> Advanced).
guild-id=

# Optional: role given to members once linked (right-click role -> Copy Role ID). Leave empty to skip.
# The bot's own role must sit ABOVE this role in Server Settings -> Roles.
linked-role-id=

# Optional: channel where joins, leaves, links and unlinks are posted. Leave empty to skip.
log-channel-id=

# ---- Chat bridge ----
# Channel that Minecraft chat is mirrored to/from (right-click channel -> Copy Channel ID).
chat-channel-id=

# Send Minecraft chat (and join/leave messages) to the Discord channel.
minecraft-to-discord=false

# Send messages from the Discord channel to everyone in game.
# Requires "Message Content Intent" turned on in the Developer Portal -> your app -> Bot,
# otherwise the bot will fail to log in.
discord-to-minecraft=false

# ---- Linking ----
# How long a link code stays valid.
code-expiry-minutes=10

# Store chat messages / commands in the audit log database.
log-chat=true
log-commands=true

# All player- and Discord-facing text is in messages.properties.
