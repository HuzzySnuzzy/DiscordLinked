# DiscordLinked configuration. Restart the proxy after changing this file.

# Bot token from https://discord.com/developers/applications -> your app -> Bot -> Reset Token.
# Keep this secret.
bot-token=

# Right-click your server in Discord -> Copy Server ID (needs Developer Mode, in Settings -> Advanced).
guild-id=

# Optional: role given to members once linked (right-click role -> Copy Role ID). Leave empty to skip.
# The bot's own role must sit ABOVE this role in Server Settings -> Roles.
linked-role-id=

# Optional: channel where joins, leaves, links and unlinks are posted. Leave empty to skip.
log-channel-id=

# ---- Chat bridge ----
# Channel that Minecraft chat is mirrored to/from (right-click channel -> Copy Channel ID).
chat-channel-id=

# Send Minecraft chat (and join/leave messages) to the Discord channel.
minecraft-to-discord=false

# Send messages from the Discord channel to everyone in game.
# Requires "Message Content Intent" turned on in the Developer Portal -> your app -> Bot,
# otherwise the bot will fail to log in.
discord-to-minecraft=false

# ---- Linking ----
# How long a link code stays valid.
code-expiry-minutes=10

# Store chat messages / commands in the audit log database.
log-chat=true
log-commands=true

# How many days to keep chat and command logs. 0 = forever.
chat-log-retention-days=90
# How many days to keep every other log entry (joins, IPs, admin actions...). 0 = forever.
log-retention-days=0

# ---- Admin website ----
# A web panel where admins log in with Discord to see linked players and logs,
# remove links and suspend players. Only members with admin-role-id get in.
web-enabled=true

# How the website is reached:
#   tunnel  (default) - a free https:// address from Cloudflare, set up automatically. No ports to open,
#                       no domain needed. The address changes when the proxy restarts; /dla always gives
#                       the current one. Downloads Cloudflare's cloudflared program on first start.
#   direct            - serve plain http on web-port yourself (e.g. behind your own reverse proxy/domain).
web-access=tunnel

# Port the website listens on. With web-access=tunnel it's only used locally, so nothing needs opening.
web-port=8080
# 0.0.0.0 = reachable from anywhere; 127.0.0.1 = only this machine (e.g. behind a reverse proxy).
web-bind-address=0.0.0.0

# web-access=direct only: the address admins open, e.g. https://panel.example.com. Leave empty to use
# http://<this server's public IP>:<web-port>.
web-public-url=

# Optional, web-access=direct only: adds a "Log in with Discord" button. /dla login links work without it.
# Developer Portal -> your app -> OAuth2. Client ID can be left empty (the bot's own ID is used).
# Add <web-public-url>/callback under OAuth2 -> Redirects. The Client Secret is like a password.
discord-client-id=
discord-client-secret=

# Role allowed into the website (right-click the role -> Copy Role ID).
admin-role-id=

# The one Discord user who can open the website's Settings page. Empty = the owner of your Discord server.
web-owner-id=

# DM players on Discord when they're suspended, kicked, unsuspended, their suspension changes or an
# admin unlinks them. The texts are the discord.dm.* entries in messages.properties.
dm-players=true

# ---- Spy (website Moderate page) ----
# Spy puts the admin's own Minecraft character in spectator next to a player. It needs the
# DiscordLinkedSpy plugin (DiscordLinkedSpy-x.y.z.jar) on every Paper server behind this proxy.
# The session ends if the admin gets further than this many blocks from the player.
spy-max-distance=1000

# ---- Inventory snapshots ----
# The companion plugin saves a player's full inventory when they die, join, leave or change world (and
# when an admin clicks "Save snapshot"). Admins can preview and restore them on the website.
# How many to keep per player; older ones are deleted.
inventory-snapshots-per-player=100
# Delete snapshots older than this many days. 0 = only the per-player limit above applies.
inventory-snapshot-retention-days=0

# ---- Community: credits & interactions (DiscordLinkedFAD) ----
# Put DiscordLinkedFAD-x.y.z.jar on your Paper/Folia servers for /hug, /kiss, /pet and friends, and for
# credits earned by playing and by advancements. The interactions themselves (commands, lines, sounds)
# are in that plugin's config.yml.
fad-enabled=true

# What credits are called: the first name is used for exactly 1, the second for any other amount.
credits-name=Credit
credits-name-plural=Credits

# Active play (not AFK) earns credits-playtime-amount for every credits-playtime-minutes. 0 = no credits.
credits-playtime-amount=5
credits-playtime-minutes=15

# Credits for an advancement, the first time a player makes it on any server. 0 = none.
# task = most advancements, goal = the rounded ones, challenge = the spiky purple ones.
credits-advancement-task=10
credits-advancement-goal=25
credits-advancement-challenge=50

# Discord channel for interactions and advancements. Empty = the chat-channel-id channel.
fad-channel-id=
# Post interactions there, with @mentions of the linked members.
fad-discord-interactions=true
# Post advancements there.
fad-discord-advancements=true
# Notify the member who was picked. Off = their @mention shows but doesn't ping them.
fad-discord-ping=false
# Make the interactions slash commands in Discord (/hug @someone). They show in game too.
fad-discord-commands=true

# ---- Google Sheets export (optional) ----
# Lets the website's "Export to Google Sheets" button write logs into a spreadsheet.
# See the README for the one-time setup (a Google service account).
# The spreadsheet ID is the long part of its URL: docs.google.com/spreadsheets/d/<THIS PART>/edit
google-sheets-spreadsheet-id=
# The service account key file, placed in this plugin folder.
google-service-account-file=google-service-account.json

# All player- and Discord-facing text is in messages.properties.
