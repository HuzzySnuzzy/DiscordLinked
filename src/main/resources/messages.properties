# DiscordLinked messages. Restart the proxy after changing this file.
#
# Keys starting with "minecraft." are shown in game and use MiniMessage:
#   https://docs.advntr.dev/minimessage/format.html  (placeholders look like <player>)
# Keys starting with "discord." are sent to Discord and use Discord markdown
#   (placeholders look like {player}).
# Use \n for a new line. Leave a log or bridge message empty to turn it off.

# ---- Shown in Minecraft -----------------------------------------------------

# Kick screen for unlinked players. <code>, <minutes>
minecraft.kick.link-required=<red><bold>Discord link required</bold></red>\n\n<gray>Join our Discord and run</gray>\n<yellow>/link <code></yellow>\n\n<gray>The code expires in <minutes> minutes, then reconnect.</gray>
minecraft.kick.unlinked=<red>Your Discord account was unlinked.</red>
# Shown to suspended players. <reason>, <expires> (date and time), <remaining> (e.g. 2d 5h)
minecraft.kick.suspended=<red><bold>You are suspended</bold></red>\n\n<gray>Reason:</gray> <white><reason></white>\n<gray>Ends:</gray> <white><expires></white> <gray>(<remaining>)</gray>
# Shown when an admin kicks a player from the website. <reason>
minecraft.kick.kicked=<red><bold>You were kicked</bold></red>\n\n<gray>Reason:</gray> <white><reason></white>
minecraft.kick.database-error=<red>Account check failed, please try again shortly.</red>

# Discord chat shown in game. <name> = Discord display name, <minecraft_name> = their linked
# Minecraft name (or Discord name if not linked), <message>
minecraft.bridge.chat=<dark_gray>[<blue>Discord</blue>]</dark_gray> <gray><name>:</gray> <white><message></white>

# /dlink
minecraft.command.usage=<red>Usage: /dlink <lookup|unlink> <player></red>
minecraft.command.not-linked=<yellow><player> is not linked.</yellow>
# <player>, <uuid>, <discord_id>, <linked_at>
minecraft.command.lookup=<gold><player></gold> <gray>(<uuid>)</gray>\n<gray>Discord ID: <white><discord_id></white>, linked <white><linked_at></white></gray>
minecraft.command.unlinked=<green>Unlinked <player>.</green>
minecraft.command.database-error=<red>Database error, check the console.</red>

# ---- Sent to Discord --------------------------------------------------------

# /link
discord.link.invalid-code=That code is invalid or expired. Join the Minecraft server again to get a new one.
discord.link.already-linked-discord=Your Discord account is already linked to `{player}`. Use /unlink first.
discord.link.already-linked-minecraft=That Minecraft account is already linked.
discord.link.success=Linked to **{player}**. You can join the server now!

# /unlink
discord.unlink.not-linked=Your Discord account isn't linked.
discord.unlink.success=Unlinked from `{player}`.

# /whois
discord.whois.missing-argument=Give a `player` or a `user`.
discord.whois.field.discord=Discord
discord.whois.field.uuid=UUID
discord.whois.field.linked=Linked
discord.whois.field.online=Online
discord.whois.online-yes=Yes
discord.whois.online-no=No

# /history  ({time} is a relative Discord timestamp)
discord.history.title=Recent activity: {player}
discord.history.line={time} **{event}** {detail}
discord.history.empty=No activity recorded.

# /forceunlink
discord.forceunlink.success=Unlinked `{player}`.

# Shared
discord.not-found=No linked account found for `{player}`.
discord.database-error=Something went wrong talking to the database.

# Log channel. {player}, {discord} (a mention, or "-" if unknown), {actor} (who did it), {detail}
# For joins and denied logins {detail} contains the player's IP, so it is left out by default.
discord.log.link=**LINK** `{player}` {discord}
discord.log.unlink=**UNLINK** `{player}` {discord} by {actor} — {detail}
discord.log.join=**JOIN** `{player}` {discord}
discord.log.leave=**LEAVE** `{player}` {discord}
discord.log.denied_unlinked=**DENIED** `{player}` (not linked)
discord.log.suspend=:no_entry: **SUSPEND** `{player}` {discord} by {actor} — {detail}
discord.log.kick=:boot: **KICK** `{player}` {discord} by {actor} — {detail}
discord.log.unsuspend=:white_check_mark: **UNSUSPEND** `{player}` {discord} by {actor} — {detail}

# Minecraft chat sent to the chat channel. {player}, {server}, {message}
discord.bridge.chat=**{player}**: {message}
discord.bridge.join=:green_circle: **{player}** joined the server
discord.bridge.leave=:red_circle: **{player}** left the server
