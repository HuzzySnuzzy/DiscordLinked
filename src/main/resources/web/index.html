<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiscordLinked Admin</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/linked"><img src="/favicon.svg" alt=""> <span class="brand-text">DiscordLinked</span></a>
    <nav class="tabs">
      <a href="#/linked" data-view="linked">Linked</a>
      <a href="#/logs" data-view="logs">Logs</a>
    </nav>
    <div class="global-search">
      <input id="global-search" type="search" placeholder="Find any player…" autocomplete="off"
             aria-label="Search all players" aria-controls="global-results">
      <div id="global-results" class="search-results" role="listbox" hidden></div>
    </div>
    <div class="me">
      <img id="me-avatar" class="avatar" alt="">
      <span id="me-name"></span>
      <a href="/logout" class="btn btn-ghost btn-small">Log out</a>
    </div>
  </header>

  <main class="content">
    <section id="view-linked" hidden>
      <div class="toolbar">
        <h1>Linked players <span id="linked-count" class="count"></span></h1>
        <div class="legend">
          <span><i class="dot dot-admin"></i> Admin</span>
          <span><i class="dot dot-suspended"></i> Suspended</span>
        </div>
        <select id="linked-sort" aria-label="Sort players">
          <option value="name-asc">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="online">Online first</option>
          <option value="seen">Recently seen</option>
          <option value="linked-new">Newest links</option>
          <option value="linked-old">Oldest links</option>
          <option value="suspended">Suspended first</option>
          <option value="admins">Admins first</option>
        </select>
        <input id="linked-search" type="search" placeholder="Filter this list…" aria-label="Filter linked players">
      </div>
      <div class="table-wrap">
        <table class="table linked-table">
          <thead>
            <tr><th>Minecraft</th><th>Discord</th><th>Status</th><th>Linked</th><th class="actions-col">Actions</th></tr>
          </thead>
          <tbody id="linked-body"></tbody>
        </table>
        <p id="linked-empty" class="empty" hidden>No linked players yet.</p>
      </div>
    </section>

    <section id="view-logs" hidden>
      <div class="toolbar">
        <h1>Logs</h1>
        <select id="logs-filter" aria-label="Filter logs">
          <option value="all">All events</option>
          <option value="admin">Admin actions</option>
          <option value="links">Links &amp; unlinks</option>
          <option value="suspensions">Suspensions</option>
          <option value="kicks">Kicks</option>
          <option value="notes">Notes</option>
          <option value="sessions">Joins, leaves &amp; switches</option>
          <option value="chat">Chat</option>
          <option value="commands">Commands</option>
          <option value="denied">Denied logins</option>
          <option value="web">Website logins &amp; exports</option>
        </select>
        <input id="logs-search" type="search" placeholder="Player or admin name…" aria-label="Search logs">
        <button id="logs-csv" class="btn btn-ghost btn-small" type="button">Download CSV</button>
        <button id="logs-sheets" class="btn btn-ghost btn-small" type="button" hidden>Export to Google Sheets</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Time</th><th>Event</th><th>Player</th><th>By</th><th>Details</th></tr>
          </thead>
          <tbody id="logs-body"></tbody>
        </table>
        <p id="logs-empty" class="empty" hidden>Nothing logged yet.</p>
      </div>
      <div class="more"><button id="logs-more" class="btn btn-ghost" type="button" hidden>Load more</button></div>
    </section>

    <section id="view-player" hidden></section>
  </main>

  <dialog id="action-dialog">
    <form id="action-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text" class="muted"></p>
      <div id="duration-fields" class="duration">
        <label>Days <input type="number" id="dur-days" min="0" max="3650" value="1"></label>
        <label>Hours <input type="number" id="dur-hours" min="0" max="999" value="0"></label>
      </div>
      <label class="reason"><span id="dialog-label">Reason (required)</span>
        <textarea id="dialog-reason" required maxlength="500" rows="3"></textarea>
      </label>
      <p id="dialog-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="dialog-cancel">Cancel</button>
        <button type="submit" class="btn" id="dialog-confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
