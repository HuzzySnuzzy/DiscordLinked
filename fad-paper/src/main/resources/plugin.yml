name: DiscordLinkedFAD
version: '${version}'
main: com.huzzysnuzzy.discordlinked.fad.DiscordLinkedFAD
api-version: '1.21'
folia-supported: true
description: Community features for DiscordLinked. Interaction commands (/hug, /kiss, /pet...) and credits for playtime and advancements, shared with Discord and the admin website. Install on every Paper or Folia server behind the Velocity proxy.
authors: [HuzzySnuzzy]
commands:
  discordlinkedfad:
    description: Reload DiscordLinkedFAD's config.yml
    usage: /discordlinkedfad reload
    aliases: [dlfad]
    permission: discordlinkedfad.admin
permissions:
  discordlinkedfad.admin:
    description: Use /discordlinkedfad reload
    default: op
  discordlinkedfad.cooldown.bypass:
    description: Use interactions without waiting for the cooldown
    default: op
  discordlinkedfad.credits:
    description: Check credits and the leaderboard
    default: true
  discordlinkedfad.interactions:
    description: List interactions and turn them off or on for yourself
    default: true
