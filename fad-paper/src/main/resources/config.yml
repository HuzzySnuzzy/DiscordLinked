# DiscordLinkedFAD: interaction commands and credits for DiscordLinked.
#
# Needs DiscordLinked 0.10.0 or newer on the Velocity proxy. The proxy keeps everyone's credits, shows
# interactions on every server and in Discord, and puts it all on the admin website.
#
# Credits themselves (their name, how many players get for playing and for advancements) are set on the
# proxy: plugins/discordlinked/config.properties, or the website's Settings page. The credit messages
# players see are in plugins/discordlinked/messages.properties.
#
# Text here uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
# After editing, run /discordlinkedfad reload. Adding or renaming a command needs a server restart.

# How every interaction looks in chat. <message> is one of the action's lines, picked at random.
format: "<#ff9bd2>✦</#ff9bd2> <gray><message></gray>"

# How player names look inside those lines. <name> is the player's name.
name-format: "<#ffd6ef><name></#ffd6ef>"

# Seconds a player waits between interactions (also used for the Discord slash commands).
# Players with discordlinkedfad.cooldown.bypass skip it.
cooldown-seconds: 5

# Whether players can pick themselves as the target, e.g. /hug <own name>.
allow-self: false

# Minutes without looking around, chatting or using commands before a player counts as AFK.
# AFK time doesn't earn credits. 0 = never AFK.
afk-minutes: 5

# Report advancements to the proxy so they earn credits (amounts are set on the proxy). Only advancements
# that are announced in chat count, so recipe unlocks and hidden helper advancements never do.
advancement-credits: true

# The credits command: /credits, /credits <player>, /credits top
credits-command:
  name: credits
  aliases: []

# Lists the interactions and lets players turn them off or on for themselves: /interactions [off|on]
interactions-command:
  name: interactions
  aliases: []

messages:
  # <command> = the command as typed
  usage-target: "<red>Usage: /<command> <player></red>"
  player-only: "<red>Only players can do that.</red>"
  # <name> = what they typed
  not-found: "<red>Nobody called <name> is on this server.</red>"
  self: "<red>You can't do that to yourself, silly~</red>"
  # <seconds>
  cooldown: "<gray>Slow down a little~ Try again in <seconds>s.</gray>"
  unavailable: "<red>That interaction isn't available right now.</red>"
  no-reply: "<red>The proxy didn't answer. Is DiscordLinked 0.10.0 or newer installed on it?</red>"
  list-header: "<#ff9bd2>Interactions</#ff9bd2> <dark_gray>·</dark_gray> <gray>click one to use it</gray>"
  # One per interaction. <command>, <args> (e.g. "<player>" or "[player]"), <description>
  list-entry: "<white>/<command></white><gray> <args></gray>"
  list-separator: "<dark_gray>, </dark_gray>"
  list-footer: "<gray>Rather not be hugged, kissed or stepped on? <white>/<command> off</white></gray>"
  # <count>
  reloaded: "<green>DiscordLinkedFAD reloaded with <count> interactions.</green>"
  # <names>
  reloaded-restart: "<yellow>Restart the server to add these new commands: <names></yellow>"

# The interactions. Each one becomes a command named after it, e.g. "kiss" is /kiss.
#   description:   shown in tab-completion help and on Discord, where these are also slash commands.
#   target:        required (/kiss <player>), optional (/meow or /meow <player>) or none (just /blush).
#   messages:      lines used when a player is picked. <actor> = who used it, <target> = who they picked.
#   solo-messages: lines used without a target. Only <actor>.
#   sound:         a Minecraft sound, e.g. entity.cat.ambient. Played where it happens. Optional.
#   particle:      a Minecraft particle without extra data, e.g. heart, happy_villager, note. Optional.
#   leap:          true makes the player leap at their target.
#   aliases:       other names for the command.
# On Discord, <actor> and <target> become @mentions of the linked Discord accounts.
# Permission per interaction: discordlinkedfad.interact.<name> (everyone has it unless you take it away).
actions:
  kiss:
    description: Kiss someone
    target: required
    sound: entity.experience_orb.pickup
    particle: heart
    aliases: [smooch]
    messages:
      - "<target>'s face lights up when <actor> presses their lips against theirs, mwahhhh!~"
      - "<actor> leans in and plants a soft kiss on <target>'s cheek~"
      - "<actor> sneaks a quick kiss onto <target>'s snoot. Mwah!"
      - "<actor> pulls <target> close for a long, sweet kiss~"
      - "<target> gets a surprise smooch from <actor>! Their tail won't stop wagging~"
      - "<actor> blows a kiss at <target>, who catches it with a blush~"

  pet:
    description: Pet someone
    target: required
    sound: entity.cat.purr
    particle: heart
    aliases: [headpat, pat]
    messages:
      - "<actor> gently pets <target> on the head. Good floof~"
      - "<actor> gives <target> the softest headpats. <target> melts~"
      - "<target> leans into <actor>'s paw as they get pets behind the ears~"
      - "<actor> scritches <target> right in the perfect spot. Their leg starts thumping!"
      - "<actor> pats <target>. Who's a good fluff? <target> is!"

  hug:
    description: Hug someone
    target: required
    sound: item.armor.equip_leather
    particle: heart
    aliases: [glomp]
    messages:
      - "<actor> wraps <target> in a big, warm hug~"
      - "<actor> glomps <target> out of nowhere! Hugs!"
      - "<target> gets squished in a bear hug by <actor>~"
      - "<actor> and <target> share a long, fluffy hug~"
      - "<actor> sneaks up behind <target> and hugs them tight~"

  boop:
    description: Boop someone's snoot
    target: required
    sound: block.note_block.bell
    particle: note
    messages:
      - "<actor> boops <target> right on the snoot! Boop!"
      - "<target>'s nose has been booped by <actor>. Beep!"
      - "<actor> sneaks in a sneaky boop on <target>~"
      - "Boop! <actor> got <target> right on the nose."

  nuzzle:
    description: Nuzzle someone
    target: required
    sound: entity.wolf.whine
    particle: heart
    messages:
      - "<actor> nuzzles into <target>'s neck fluff~"
      - "<actor> rubs their cheek against <target> affectionately~"
      - "<target> gets a gentle nuzzle from <actor>. So soft~"
      - "<actor> nuzzles <target> and lets out a happy little sigh~"

  cuddle:
    description: Cuddle up with someone
    target: required
    sound: entity.cat.purr
    particle: heart
    aliases: [snuggle]
    messages:
      - "<actor> curls up and cuddles with <target>~"
      - "<actor> snuggles up against <target>, all warm and fluffy~"
      - "<target> has become <actor>'s favourite cuddle pillow~"
      - "<actor> and <target> pile into a cozy cuddle heap~"

  pounce:
    description: Pounce on someone
    target: required
    sound: entity.fox.aggro
    particle: crit
    leap: true
    messages:
      - "<actor> wiggles their butt... and POUNCES on <target>!"
      - "<target> never saw it coming! <actor> pounces on them!"
      - "<actor> leaps at <target> and tackles them into a pile of fluff!"
      - "<actor> pounces on <target> and refuses to let go~"
      - "*wiggle wiggle* <actor> pounces on <target>! Got 'em!"

  stepon:
    description: Step on someone
    target: required
    sound: block.wool.step
    particle: cloud
    messages:
      - "<actor> steps on <target>. <target> seems... oddly happy about it~"
      - "<actor> plants a paw right on top of <target>. Squish!"
      - "<target> lies down and lets <actor> step all over them~"
      - "<actor> stomps on <target> with their big fluffy feet!"
      - "<actor> walks right over <target> like a doormat. Rude! (<target> doesn't mind~)"

  lick:
    description: Lick someone
    target: required
    sound: entity.wolf.pant
    particle: splash
    aliases: [mlem]
    messages:
      - "<actor> licks <target>'s cheek. Bleh!"
      - "<actor> gives <target> a big slobbery lick!"
      - "<target> gets a surprise lick from <actor>. Mlem!"
      - "Mlem! <actor> licked <target>."

  nom:
    description: Give someone a playful nom
    target: required
    sound: entity.fox.bite
    particle: crit
    aliases: [bite]
    messages:
      - "<actor> noms on <target>'s ear. Nom nom~"
      - "<actor> gives <target> a playful little bite!"
      - "<target>'s tail has been nommed by <actor>!"
      - "<actor> chomps gently on <target>. Tasty~"

  meow:
    description: Meow (at someone)
    target: optional
    sound: entity.cat.ambient
    particle: note
    aliases: [mew]
    messages:
      - "<actor> meows at <target>~"
      - "<actor> looks <target> in the eyes and goes mrrp?"
      - "<actor> mews softly at <target>, wanting attention~"
    solo-messages:
      - "<actor> lets out a little meow~"
      - "<actor>: meow! :3"
      - "<actor> mrrps happily~"
      - "<actor> meows for no reason at all."

  bark:
    description: Bark (at someone)
    target: optional
    sound: entity.wolf.ambient
    particle: note
    aliases: [woof, bork]
    messages:
      - "<actor> barks at <target>! Woof!"
      - "<actor> boofs at <target>."
      - "<actor> yips excitedly at <target>!"
    solo-messages:
      - "<actor> barks! Woof woof!"
      - "<actor> lets out a happy bork!"
      - "<actor>: Arf! Arf!"
      - "<actor> boofs quietly."

  purr:
    description: Purr (at someone)
    target: optional
    sound: entity.cat.purr
    particle: heart
    messages:
      - "<actor> purrs contentedly next to <target>~"
      - "<actor> purrs loudly at <target>. Prrrr~"
    solo-messages:
      - "<actor> starts purring~"
      - "<actor> rumbles with a soft purr~"
      - "Prrrrr... <actor> is very content."

  howl:
    description: Howl (with someone)
    target: optional
    sound: entity.wolf.howl
    messages:
      - "<actor> howls at <target>! Awoooo!"
      - "<actor> and <target> howl together at the moon~"
    solo-messages:
      - "<actor> throws their head back and howls! Awooooo!"
      - "<actor> howls at the moon~"
      - "Awoo! <actor> joins the chorus."

  wag:
    description: Wag your tail (at someone)
    target: optional
    sound: entity.wolf.shake
    particle: happy_villager
    messages:
      - "<actor>'s tail goes wild when they see <target>!"
      - "<actor> wags their tail at <target>~"
    solo-messages:
      - "<actor> wags their tail happily~"
      - "<actor>'s tail is wagging a mile a minute!"
      - "Wag wag wag! <actor> is excited."

  blush:
    description: Blush (at someone)
    target: optional
    sound: block.amethyst_block.chime
    particle: heart
    messages:
      - "<actor> blushes when <target> looks their way~"
      - "<actor> hides their face from <target>, blushing furiously!"
    solo-messages:
      - "<actor> blushes~"
      - "<actor>'s cheeks turn bright pink~"
      - "<actor> covers their face with their paws, all flustered!"

  growl:
    description: Growl (at someone)
    target: optional
    sound: entity.wolf.growl
    particle: angry_villager
    aliases: [grr]
    messages:
      - "<actor> growls playfully at <target>. Grrr!"
      - "<actor> bares their teeth at <target>... then giggles."
    solo-messages:
      - "<actor> lets out a low growl. Grrr~"
      - "<actor> grumbles and growls."
